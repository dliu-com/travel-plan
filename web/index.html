<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Plan · dliu.com</title>
  <link rel="icon" type="image/png" href="https://files.dliu.com/dliu.com/favicon.png">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="site">
    <div class="brand-row">
      <a class="logo" href="https://dliu.com" aria-label="dliu.com"><img src="https://files.dliu.com/dliu.com/favicon.png" width="36" height="36" alt="DL"></a>
      <a class="brand" href="/">DL Plan</a>
    </div>
    <div class="header-end">
      <div id="account"></div>
      <button type="button" class="language-toggle" aria-controls="site-languages" aria-expanded="false" aria-label="Language / 语言">文/A</button>
      <div id="site-languages" class="languages" role="group" aria-label="Language / 语言">
        <button type="button" data-language="zh" lang="zh">中文</button>
        <button type="button" data-language="en" lang="en">English</button>
      </div>
    </div>
  </header>

  <main id="main">
    <p id="status" role="status"></p>
  </main>
</body>
</html>
